[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "pydantic-settings>=2,<3", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "uvicorn>=0.34,<1", "argon2-cffi>=25,<26", "email-validator>=2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
"app.seed" = ["demo.json"]

[tool.pytest.ini_options]
addopts = "--tb=short"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
